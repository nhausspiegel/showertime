<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F3F1">
<link rel="manifest" href="manifest.json">
<title>timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="connect-screen">
  <p class="label">connect your account to start</p>
  <button id="connect-btn">Connect Spotify</button>
</section>

<section id="home-screen" hidden>
  <div class="duration-input">
    <input id="minutes" type="number" inputmode="numeric" min="0" value="25" aria-label="minutes">
    <span>:</span>
    <input id="seconds" type="number" inputmode="numeric" min="0" max="59" value="00" aria-label="seconds">
  </div>
  <button id="start-btn" class="primary" disabled>Start</button>
  <p id="status-text" class="status"></p>
</section>

<section id="live-screen" hidden>
  <p id="adjust-notice" class="status" hidden></p>
  <div id="countdown">0:00</div>
  <div class="progress-track"><div id="progress-bar"></div></div>

  <div class="now-playing-row">
    <img id="album-art" alt="" hidden>
    <div class="now-playing-text">
      <p id="now-playing" class="label"></p>
      <p id="track-time" class="status"></p>
    </div>
  </div>

  <button id="queue-toggle" class="ghost" aria-expanded="false" aria-controls="queue-panel">Queue</button>
  <div id="queue-panel" hidden>
    <ul id="queue-list"></ul>
  </div>
  <p id="queue-total" class="status" hidden></p>

  <div class="controls">
    <button id="pause-btn" class="primary">Pause</button>
    <button id="cancel-btn" class="ghost">Cancel</button>
  </div>
</section>

<div id="version-tag"></div>

<script type="module" src="app.js"></script>
</body>
</html>
